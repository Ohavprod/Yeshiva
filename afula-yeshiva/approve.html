<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אישור טיול — ישיבה תיכונית עפולה</title>
<link rel="icon" href="assets/img/logo.gif">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body{ background:var(--paper); }
  .approve-wrap{ max-width:560px; margin:0 auto; padding:32px 20px 60px; }
  .approve-header{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .approve-header img{ height:48px; width:48px; border-radius:50%; }
  .trip-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow-sm); margin-bottom:22px; }
  .trip-meta{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0; font-size:.92rem; }
  .trip-meta div span{ display:block; color:var(--ink-soft); font-size:.78rem; }
  .student-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .student-row.approved{ border-color:var(--ok); background:var(--ok-bg); }
  .sign-box{ margin-top:10px; display:none; }
  .sign-box.open{ display:block; }
  .center-msg{ text-align:center; color:var(--ink-soft); padding:60px 20px; }
</style>
</head>
<body>
<div class="approve-wrap">
  <div class="approve-header">
    <img src="assets/img/logo.gif" alt="">
    <div>
      <div style="font-family:'Frank Ruhl Libre',serif; font-weight:700; color:var(--navy);">ישיבה תיכונית עפולה</div>
      <div style="font-size:.8rem; color:var(--ink-soft);">אישור השתתפות בטיול</div>
    </div>
  </div>
  <div id="content"><p class="center-msg">טוען פרטי טיול…</p></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabaseClient.js"></script>
<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const params = new URLSearchParams(location.search);
const token = params.get('t');
const focusStudent = params.get('s');

async function load(){
  const content = document.getElementById('content');
  if (!token){
    content.innerHTML = '<p class="center-msg">קישור לא תקין. יש לוודא שהקישור המלא שהתקבל הועתק במלואו.</p>';
    return;
  }
  const { data, error } = await sb.rpc('get_batch_by_token', { p_token: token });
  if (error || !data || data.length === 0){
    content.innerHTML = '<p class="center-msg">לא נמצא טיול התואם לקישור זה. ייתכן שהקישור אינו תקין.</p>';
    return;
  }
  const trip = data[0];
  let rows = data;
  if (focusStudent) rows = data.filter(r => r.student_id === focusStudent);

  content.innerHTML = `
    <div class="trip-card">
      <h2 style="margin-top:0;">${esc(trip.trip_title)}</h2>
      <div class="trip-meta">
        ${trip.trip_date ? `<div><span>תאריך</span>${new Date(trip.trip_date).toLocaleDateString('he-IL')}</div>` : ''}
        ${trip.trip_location ? `<div><span>יעד</span>${esc(trip.trip_location)}</div>` : ''}
        ${trip.departure_time ? `<div><span>שעת יציאה</span>${esc(trip.departure_time)}</div>` : ''}
        ${trip.return_time ? `<div><span>שעת חזרה</span>${esc(trip.return_time)}</div>` : ''}
        ${trip.cost ? `<div><span>עלות</span>${esc(trip.cost)}</div>` : ''}
      </div>
      ${trip.notes ? `<p style="color:var(--ink-soft); font-size:.9rem; border-top:1px solid var(--line); padding-top:14px;">${esc(trip.notes)}</p>` : ''}
    </div>
    <h3 style="font-size:1.05rem;">${rows.length>1 ? 'אישור עבור התלמידים הבאים' : 'אישור השתתפות'}</h3>
    <div id="studentRows"></div>
  `;

  const wrap = document.getElementById('studentRows');
  wrap.innerHTML = rows.map(r => `
    <div class="student-row ${r.status==='approved' ? 'approved':''}" data-student="${r.student_id}">
      <div style="width:100%;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>${esc(r.student_name)}</strong>
          ${r.status==='approved'
            ? `<span class="badge badge-ok">✓ אושר ע״י ${esc(r.approved_by_name||'')}</span>`
            : `<button class="btn btn-primary btn-sm open-sign">אישור והשתתפות</button>`}
        </div>
        <div class="sign-box" id="sign-${r.student_id}">
          <div class="field" style="margin-top:12px;">
            <label>שם ההורה/ת המאשר/ת</label>
            <input placeholder="שם מלא" id="name-${r.student_id}">
          </div>
          <button class="btn btn-primary btn-sm confirm-sign" data-student="${r.student_id}">✓ אני מאשר/ת השתתפות</button>
        </div>
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('.open-sign').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('.student-row');
      row.querySelector('.sign-box').classList.add('open');
      btn.style.display = 'none';
    });
  });
  wrap.querySelectorAll('.confirm-sign').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const sid = btn.dataset.student;
      const name = document.getElementById('name-'+sid).value.trim();
      if (!name){ toast('יש להזין שם'); return; }
      btn.disabled = true;
      const { data: ok, error } = await sb.rpc('approve_student_in_batch', {
        p_token: token, p_student_id: sid, p_approver_name: name,
      });
      if (error || !ok){ toast('אירעה שגיאה, נסו שוב'); btn.disabled = false; return; }
      toast('האישור נקלט, תודה!');
      load();
    });
  });
}
load();
</script>
</body>
</html>
