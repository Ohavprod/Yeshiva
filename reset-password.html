<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>איפוס סיסמה — ישיבה תיכונית עפולה</title>
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand-row">
      <img src="assets/img/logo.png" alt="">
      <div><div style="font-family:'Rubik',sans-serif; font-weight:700;">ישיבה תיכונית עפולה</div></div>
    </div>
    <h2>איפוס סיסמה</h2>
    <p class="sub" id="subLine">בודק את הקישור…</p>
    <div id="resetMsg"></div>

    <form id="resetForm" style="display:none;">
      <div class="field">
        <label>סיסמה חדשה</label>
        <input type="password" id="newPassword" minlength="6" required autocomplete="new-password">
      </div>
      <div class="field">
        <label>אימות סיסמה</label>
        <input type="password" id="newPasswordConfirm" minlength="6" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary" style="width:100%;" type="submit">שמירת הסיסמה החדשה</button>
    </form>

    <div id="successBox" style="display:none; text-align:center;">
      <p style="color:var(--ok); font-weight:700; margin-bottom:14px;">✅ הסיסמה עודכנה בהצלחה!</p>
      <a class="btn btn-primary" style="width:100%; display:block;" href="staff.html">מעבר למסך ההתחברות</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebaseClient.js"></script>
<script>
const params = new URLSearchParams(location.search);
const mode = params.get('mode');
const oobCode = params.get('oobCode');

const subLine = document.getElementById('subLine');
const msgEl = document.getElementById('resetMsg');
const form = document.getElementById('resetForm');

function showError(text){
  subLine.textContent = '';
  msgEl.innerHTML = `<div class="login-msg err">${text}</div>`;
}

async function init(){
  if (mode !== 'resetPassword' || !oobCode){
    showError('הקישור אינו תקין. יש לבקש קישור חדש לאיפוס סיסמה דרך מסך ההתחברות.');
    return;
  }
  try{
    const email = await auth.verifyPasswordResetCode(oobCode);
    subLine.textContent = `הגדרת סיסמה חדשה עבור ${email}`;
    form.style.display = '';
  }catch(err){
    let text = 'אירעה שגיאה באימות הקישור.';
    if (err.code === 'auth/expired-action-code') text = 'תוקף הקישור פג. יש לבקש קישור חדש לאיפוס סיסמה דרך מסך ההתחברות.';
    if (err.code === 'auth/invalid-action-code') text = 'הקישור כבר נוצל או שאינו תקין. יש לבקש קישור חדש לאיפוס סיסמה דרך מסך ההתחברות.';
    if (err.code === 'auth/user-disabled') text = 'חשבון זה הושבת. יש לפנות למנהל המערכת.';
    showError(text);
  }
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  msgEl.innerHTML = '';
  const newPassword = document.getElementById('newPassword').value;
  const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;
  if (newPassword !== newPasswordConfirm){
    msgEl.innerHTML = `<div class="login-msg err">הסיסמאות שהוקלדו אינן תואמות — יש לנסות שוב.</div>`;
    return;
  }
  if (newPassword.length < 6){
    msgEl.innerHTML = `<div class="login-msg err">הסיסמה חייבת להכיל לפחות 6 תווים.</div>`;
    return;
  }
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'שומר…';
  try{
    await auth.confirmPasswordReset(oobCode, newPassword);
    form.style.display = 'none';
    subLine.textContent = '';
    document.getElementById('successBox').style.display = '';
  }catch(err){
    let text = 'אירעה שגיאה בשמירת הסיסמה. נא לנסות שוב.';
    if (err.code === 'auth/weak-password') text = 'הסיסמה חלשה מדי — יש לבחור סיסמה עם לפחות 6 תווים.';
    if (err.code === 'auth/expired-action-code' || err.code === 'auth/invalid-action-code') text = 'תוקף הקישור פג או שכבר נוצל. יש לבקש קישור חדש דרך מסך ההתחברות.';
    msgEl.innerHTML = `<div class="login-msg err">${text}</div>`;
    btn.disabled = false; btn.textContent = 'שמירת הסיסמה החדשה';
  }
});

init();
</script>
</body>
</html>
