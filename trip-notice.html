<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חוזר טיול — ישיבה תיכונית עפולה</title>
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="style.css">
<style>
  body{ background:var(--paper); }
  .notice-wrap{ max-width:640px; margin:0 auto; padding:0 0 60px; }
  .notice-header{
    position:relative; overflow:hidden;
    background:radial-gradient(1100px 500px at 85% -20%, #1f3563 0%, var(--navy) 55%, var(--navy) 100%);
    color:#fff; text-align:center; padding:40px 24px 34px;
  }
  .notice-header .ring{ position:absolute; inset:0; pointer-events:none; opacity:.5; }
  .notice-header .logo-badge{
    position:relative; z-index:1; height:76px; width:76px; border-radius:50%; margin:0 auto 14px;
    background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -8px rgba(0,0,0,.4);
    overflow:hidden;
  }
  .notice-header .logo-badge img{ height:100%; width:100%; object-fit:cover; }
  .notice-header .school{ position:relative; z-index:1; font-family:'Rubik',sans-serif; font-weight:800; font-size:1.25rem; }
  .notice-header .tag{ position:relative; z-index:1; font-size:.82rem; color:#a9c6ee; margin-top:3px; }
  .notice-body{ padding:26px 24px 0; }
  .trip-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow-sm); margin-bottom:22px; }
  .meta-badges{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin:20px 0 6px; }
  .meta-badge{ width:96px; text-align:center; }
  .meta-badge .m-icon{
    width:52px; height:52px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; background:var(--paper-2); color:var(--steel);
  }
  .meta-badge:nth-child(odd) .m-icon{ background:var(--navy); color:#fff; }
  .meta-badge .m-label{ font-size:.7rem; color:var(--ink-soft); }
  .meta-badge .m-value{ font-size:.85rem; font-weight:700; color:var(--navy); line-height:1.3; }
  .tear-line{
    display:flex; align-items:center; gap:10px; margin:26px 0 20px; color:var(--ink-soft);
    border-top:2px dashed var(--line);
  }
  .tear-line span{ margin-top:-13px; background:var(--paper); padding:0 10px; font-size:1.1rem; }
  .center-msg{ text-align:center; color:var(--ink-soft); padding:60px 20px; }
  .approved-card{ text-align:center; padding:40px 24px; }
  .approved-card .big-check{ font-size:3rem; margin-bottom:10px; }
  .consent-check{
    display:flex; align-items:flex-start; gap:10px; cursor:pointer; padding:14px 16px;
    border:1.5px solid var(--line); border-radius:12px; background:#fbfcfe; font-size:.95rem;
  }
  .consent-check input{ width:20px; height:20px; margin-top:2px; accent-color:var(--teal); flex:none; }
  .startBtnWrap{ text-align:center; padding:20px 0 4px; }
  @media (max-width:480px){
    .trip-meta{ grid-template-columns:1fr; } .trip-card{ padding:20px; } .notice-body{ padding:20px 14px 0; }
    .meta-badge{ width:78px; }
    .meta-badge .m-icon{ width:44px; height:44px; font-size:1.15rem; }
  }
</style>
</head>
<body>
<div class="notice-wrap">
  <div class="notice-header">
    <div class="ring">
      <svg width="100%" height="100%" viewBox="0 0 400 220" preserveAspectRatio="none" style="position:absolute; inset:0;">
        <circle cx="360" cy="10" r="140" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
        <circle cx="360" cy="10" r="100" fill="none" stroke="rgba(79,163,220,.15)" stroke-width="1.5" stroke-dasharray="4 9"/>
      </svg>
    </div>
    <div class="logo-badge"><img src="assets/img/logo.gif" alt=""></div>
    <div class="school">ישיבה תיכונית עפולה</div>
    <div class="tag">חוזר טיול — לעיון ולאישור ההורים</div>
  </div>
  <div class="notice-body" id="content"><p class="center-msg">טוען פרטי טיול…</p></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebaseClient.js"></script>
<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return (s||'').toString().trim().replace(/\s+/g,' ').toLowerCase(); }

const params = new URLSearchParams(location.search);
const tripId = params.get('t');

/* --- לוח חתימה פשוט (עכבר + מגע) --- */
function setupSignaturePad(canvas){
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = 160 * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#16203a';
  }
  resize();
  let drawing = false, last = null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
  function move(e){
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); },
    isEmpty(){
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    },
    dataUrl(){ return canvas.toDataURL('image/png'); },
  };
}

async function load(){
  const content = document.getElementById('content');
  if (!tripId){
    content.innerHTML = '<p class="center-msg">קישור לא תקין.</p>';
    return;
  }
  const tripRef = db.collection('trips').doc(tripId);
  const tripSnap = await tripRef.get();
  if (!tripSnap.exists){
    content.innerHTML = '<p class="center-msg">הטיול לא נמצא.</p>';
    return;
  }
  const trip = tripSnap.data();
  const roster = trip.roster_snapshot || [];
  const classOptions = trip.class_options || [];

  const tripDetailsHtml = `
    <div class="trip-card">
      <h2 style="margin-top:0; text-align:center;">${esc(trip.title)}</h2>
      <div class="meta-badges">
        ${trip.trip_date ? `<div class="meta-badge"><div class="m-icon">📅</div><div class="m-label">תאריך</div><div class="m-value">${new Date(trip.trip_date).toLocaleDateString('he-IL')}</div></div>` : ''}
        ${trip.departure_time ? `<div class="meta-badge"><div class="m-icon">🕐</div><div class="m-label">יציאה</div><div class="m-value">${esc(trip.departure_time)}</div></div>` : ''}
        ${trip.return_time ? `<div class="meta-badge"><div class="m-icon">🕐</div><div class="m-label">חזרה</div><div class="m-value">${esc(trip.return_time)}</div></div>` : ''}
        ${trip.location ? `<div class="meta-badge"><div class="m-icon">📍</div><div class="m-label">יעד</div><div class="m-value">${esc(trip.location)}</div></div>` : ''}
        ${trip.cost ? `<div class="meta-badge"><div class="m-icon">💰</div><div class="m-label">עלות</div><div class="m-value">${esc(trip.cost)}</div></div>` : ''}
      </div>
      ${trip.notes ? `<p style="color:var(--ink-soft); border-top:1px solid var(--line); padding-top:16px; margin-top:20px;">${esc(trip.notes)}</p>` : ''}
    </div>
    <div class="tear-line"><span>✂️</span></div>`;

  if (roster.length === 0 || classOptions.length === 0){
    content.innerHTML = tripDetailsHtml + `<p class="center-msg">לא ניתן לטעון אישור עצמאי לטיול זה. יש לפנות למחנך/ת לקבלת קישור אישי.</p>`;
    return;
  }

  content.innerHTML = tripDetailsHtml + `
    <div class="trip-card" id="approvalCard">
      <h3 style="margin-top:0;">אישור יציאה והשתתפות</h3>
      <p style="color:var(--ink-soft); font-size:.88rem; margin-top:-6px;">למניעת טעויות, האישור מזהה את התלמיד לפי הצלבת כיתה + שם הורה + שם תלמיד יחד.</p>
      <div class="startBtnWrap" id="startWrap">
        <button class="btn btn-primary" id="startBtn">✍️ מילוי אישור יציאה</button>
      </div>
      <div id="formArea" style="display:none;">
        <div class="field">
          <label>כיתת הבן</label>
          <select id="classSelect">
            <option value="">— בחר/י —</option>
            ${classOptions.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>שם התלמיד (הבן)</label>
          <input id="studentNameInput" placeholder="שם פרטי ומשפחה">
        </div>
        <div class="field">
          <label>שם ההורה/ת המאשר/ת</label>
          <input id="approverName" placeholder="שם מלא">
        </div>
        <div class="field">
          <label class="consent-check">
            <input type="checkbox" id="consentCheck">
            <span>אני מאשר לבני לצאת ולהשתתף בטיול</span>
          </label>
        </div>
        <div class="field">
          <label>חתימה</label>
          <div class="sig-pad-wrap"><canvas id="sigCanvas"></canvas></div>
          <button type="button" class="sig-clear" id="sigClear">ניקוי החתימה</button>
        </div>
        <div id="matchMsg"></div>
        <button class="btn btn-primary" style="width:100%;" id="submitApproval">✓ שליחת אישור</button>
      </div>
      <div id="resultArea"></div>
    </div>`;

  document.getElementById('startBtn').addEventListener('click', ()=>{
    document.getElementById('startWrap').style.display = 'none';
    document.getElementById('formArea').style.display = '';
  });

  const pad = setupSignaturePad(document.getElementById('sigCanvas'));
  document.getElementById('sigClear').addEventListener('click', ()=> pad.clear());

  document.getElementById('submitApproval').addEventListener('click', async ()=>{
    const matchMsg = document.getElementById('matchMsg');
    matchMsg.innerHTML = '';
    const classId = document.getElementById('classSelect').value;
    const studentName = document.getElementById('studentNameInput').value.trim();
    const approverName = document.getElementById('approverName').value.trim();

    if (!classId){ toast('יש לבחור כיתה'); return; }
    if (!studentName){ toast('יש להזין את שם התלמיד'); return; }
    if (!approverName){ toast('יש להזין את שמך'); return; }
    if (!document.getElementById('consentCheck').checked){ toast('יש לאשר את השתתפות הבן בטיול'); return; }
    if (pad.isEmpty()){ toast('יש לחתום לפני השליחה'); return; }

    // הצלבה: כיתה + שם תלמיד + שם הורה — כל השלושה יחד, בלי הצגת רשימה גלויה בשום שלב
    const candidates = roster.filter(r =>
      r.class_id === classId &&
      norm(r.full_name) === norm(studentName) &&
      norm(r.parent_name) === norm(approverName)
    );

    if (candidates.length === 0){
      matchMsg.innerHTML = `<p style="color:var(--danger); font-size:.88rem;">לא נמצאה התאמה לפרטים שהוזנו. יש לוודא שהכיתה, שם התלמיד ושם ההורה תואמים בדיוק למה שרשום במערכת הישיבה, או לפנות למחנך/ת.</p>`;
      return;
    }
    if (candidates.length > 1){
      matchMsg.innerHTML = `<p style="color:var(--danger); font-size:.88rem;">נמצאה יותר מהתאמה אחת. יש לפנות למחנך/ת הכיתה לקבלת קישור אישור אישי.</p>`;
      return;
    }

    const studentId = candidates[0].id;
    const approvalRef = tripRef.collection('approvals').doc(studentId);
    const approvalSnap = await approvalRef.get();
    if (!approvalSnap.exists){
      matchMsg.innerHTML = `<p style="color:var(--danger); font-size:.88rem;">לא נמצא רישום אישור עבור תלמיד זה. יש לפנות למחנך/ת.</p>`;
      return;
    }
    if (approvalSnap.data().status === 'approved'){
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('resultArea').innerHTML = `<div class="approved-card"><div class="big-check">✅</div><p style="color:var(--ink-soft); margin:0;">כבר אושר קודם, תודה!</p></div>`;
      return;
    }

    const btn = document.getElementById('submitApproval');
    btn.disabled = true; btn.textContent = 'שולח…';
    try{
      await approvalRef.update({
        status: 'approved',
        approved_by_name: approverName,
        consent: true,
        signature: pad.dataUrl(),
        approved_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('resultArea').innerHTML = `<div class="approved-card"><div class="big-check">✅</div><p style="margin:0;">האישור נקלט, תודה!</p></div>`;
    }catch(err){
      toast('אירעה שגיאה, נסו שוב');
      btn.disabled = false; btn.textContent = '✓ שליחת אישור';
    }
  });
}
load();
</script>
</body>
</html>
