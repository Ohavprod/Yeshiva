     כרטיסים לבנים זהים מרחפים זה מתחת לזה (שהרגישה מודולרית/גנרית, "כמו אפליקציה"

     (טופס), לא עוד קטע קריאה, וההפרדה עצמה מסמנת "כאן עוברים מקריאה לפעולה". */

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
/* --- שליחת התראת פוש (best-effort — לא חוסמת ולא נכשלת אם השרת לא מוגדר עדיין) ---
   ה-Content-Type נשאר ברירת המחדל (text/plain) בכוונה כדי למנוע preflight/CORS מול Apps Script.
   classId (אופציונלי): class_id של התלמיד/ה, כדי שהשרת יוכל לסנן את ההתראה למחנך/ת
   הכיתה הנכונה בלבד (ולא לכל מחנכי הכיתות בטיול/אירוע כלל-ישיבתי). */
const PUSH_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyyFdMIyybL6S5tW0mXij3BB_6_M42g1gZtBub6ob2V40x4jYuFtnlk7su_EqbWklgQfw/exec';
const PUSH_WEBHOOK_SECRET = '88888888888888888888888888888888';
function notifyPush(type, title, body, classId){
  if (!PUSH_WEBHOOK_URL || PUSH_WEBHOOK_URL.indexOf('PASTE_') === 0) return;
  fetch(PUSH_WEBHOOK_URL, { method:'POST', body: JSON.stringify({ secret: PUSH_WEBHOOK_SECRET, type, title, body, class_id: classId || null }) }).catch(()=>{});
}
function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// אייקוני קו עקביים (currentColor, stroke-width אחיד) במקום אימוג'י — זה מה שגרם
// לתחושת "יצרתי עם AI, זול" בעיקר. כולם באותו סגנון חזותי בכוונה.
const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>';
const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
const ICON_BANKNOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9v0M18 15v0"/></svg>';
const ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>';
const ICON_BACKPACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8V6a4 4 0 0 1 8 0v2"/><rect x="5" y="8" width="14" height="13" rx="3"/><path d="M9 8v4h6V8M9 15h6"/></svg>';
// טבעת "חותמת" (מהדהדת את טבעות הלוגו) — אלמנט חד ומכוון אחד שמדגיש "אישור רשמי",
// במקום דקורציה מפוזרת. שקוף כמעט, רק רמז חזותי.
const SEAL_RING_SVG = '<svg class="seal-ring" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--navy)" stroke-width="1.5"/><circle cx="110" cy="110" r="78" fill="none" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="3 8"/></svg>';
function fmtCost(v){ if (!v) return ''; const s = v.toString().trim(); return s.includes('₪') ? s : `${s} ₪`; }
function formatGregShort(dateStr){
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear().toString().slice(-2)}`;
}
function norm(s){ return (s||'').toString().trim().replace(/\s+/g,' ').toLowerCase(); }
function firstNameOf(s){ return norm(s).split(' ')[0] || ''; }
function lastNameOf(s){ return norm(s).split(' ').slice(1).join(' '); }
// שם פרטי/משפחה "אמיתיים" של תלמיד/ה ברשימה: אם roster_snapshot כולל first_name/last_name
// נפרדים (כך שנשמר בכרטיס התלמיד/ה) — משתמשים בהם ישירות, כי הם לא תלויים בניחוש לפי
// מיקום מילה ולכן עובדים נכון גם לשמות פרטיים מכמה מילים (למשל "בת אל", "מרים חנה").
// רק לרשומות ישנות בלי השדות הנפרדים נופלים חזרה על הניחוש הישן (מילה ראשונה = שם פרטי).
function candFirstName(r){ return r.first_name ? norm(r.first_name) : firstNameOf(r.full_name); }
function candLastName(r){ return r.last_name ? norm(r.last_name) : lastNameOf(r.full_name); }
// בודק שהמחרוזת שההורה הקליד מתחילה בדיוק בשם הפרטי של המועמד/ת, בגבול מילה שלם —
// כדי ש"בת" לא יתאים בטעות ל"בתיה" או ל"בת שבע" כשההורה הקליד רק "בת אל".
function typedStartsWithFirstName(typedNorm, candFirst){
  if (!candFirst) return false;
  return typedNorm === candFirst || typedNorm.startsWith(candFirst + ' ');
}
// מה שנשאר אחרי הורדת השם הפרטי שהתאים — זה מה שמשווים מול שם המשפחה של המועמד/ת.
function remainderAfterFirstName(typedNorm, candFirst){
  return typedNorm === candFirst ? '' : typedNorm.slice(candFirst.length + 1);
}
function normPhoneDigits(s){
  let d = (s||'').toString().replace(/\D/g,'');
  // תמיכה בהזנת מספר עם קידומת בינלאומית (972.../‎+972...) במקום 0 מקומי — כדי
  // ששני הפורמטים ("0501234567" ו-"972501234567") ינורמלו לאותה מחרוזת בדיוק,
  // ולא ייתפסו כאי-התאמה שגויה בין הורה שמקליד פורמט שונה מזה שנשמר במערכת.
  if (d.startsWith('972') && d.length === 12){ d = '0' + d.slice(3); }
  return d;
}
function cleanText(s){ return (s||'').toString().trim().replace(/\s+/g,' '); }
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* --- לוח חתימה פשוט (עכבר + מגע) --- */
function setupSignaturePad(canvas){
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = 160 * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#16203a';
  }
  resize();
  let drawing = false, last = null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
  function move(e){
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); },
    isEmpty(){
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    },
    dataUrl(){ return canvas.toDataURL('image/png'); },
  };
}

async function load(){
  const content = document.getElementById('content');
  if (!tripId){
    content.innerHTML = '<p class="center-msg">קישור לא תקין.</p>';
    return;
  }
  const tripRef = db.collection('trips').doc(tripId);
  const tripSnap = await tripRef.get();
  if (!tripSnap.exists){
    content.innerHTML = '<p class="center-msg">הטיול לא נמצא.</p>';
    return;
  }
  const trip = tripSnap.data();
  const roster = trip.roster_snapshot || [];
  const classOptions = trip.class_options || [];
  const itinerary = trip.itinerary || [];

  const gregDate = formatGregShort(trip.trip_date);
  const isEvent = trip.kind === 'event';
  const detailsWord = isEvent ? 'האירוע' : 'הטיול';

  let mainHtml = `
    <div class="notice-sheet">
      <div class="notice-section">
        <h2 class="trip-title" style="margin-bottom:${trip.subtitle ? '2px' : ''};">${esc(trip.title)}</h2>
        ${trip.subtitle ? `<div style="color:var(--ink-soft); font-size:1.15rem; font-weight:600; margin-bottom:14px;">${esc(trip.subtitle)}</div>` : ''}
        ${trip.intro_text ? `<div class="intro-callout">${esc(trip.intro_text)}</div>` : ''}
        ${(trip.hebrew_date || gregDate) ? `<div class="date-line">
          <span class="lbl">תאריך ${detailsWord}</span>
          ${trip.hebrew_date ? `<span class="heb">${esc(trip.hebrew_date)}</span>` : ''}
          ${trip.hebrew_date && gregDate ? `<span class="greg">(${gregDate})</span>` : (gregDate ? `<span class="heb">${gregDate}</span>` : '')}
        </div>` : ''}
        <div class="meta-badges">
          ${trip.location ? `<div class="meta-badge"><div class="m-icon">${ICON_PIN}</div><div class="m-label">${isEvent ? 'מיקום האירוע' : 'יעד'}</div><div class="m-value">${esc(trip.location)}</div></div>` : ''}
          ${trip.departure_time ? `<div class="meta-badge"><div class="m-icon">${ICON_CLOCK}</div><div class="m-label">${isEvent ? 'תחילת האירוע' : 'שעת יציאה מהישיבה'}</div><div class="m-value">${esc(trip.departure_time)}</div></div>` : ''}
          ${trip.return_time ? `<div class="meta-badge"><div class="m-icon">${ICON_CLOCK}</div><div class="m-label">${isEvent ? 'סיום האירוע' : 'שעת חזרה לישיבה'}</div><div class="m-value">${esc(trip.return_time)}</div></div>` : ''}
          ${trip.cost ? `<div class="meta-badge"><div class="m-icon">${ICON_BANKNOTE}</div><div class="m-label">עלות</div><div class="m-value">${esc(fmtCost(trip.cost))}</div></div>` : ''}
        </div>
      </div>`;

  if (itinerary.length){
    mainHtml += `
      <div class="notice-rule"></div>
      <div class="notice-section">
        <h3 class="notice-heading"><span class="nh-icon">${ICON_LIST}</span> מה בתוכנית</h3>
        ${itinerary.map((it,i)=>`
          <div class="timeline-item">
            <div class="timeline-rail"><div class="timeline-dot"></div>${i < itinerary.length-1 ? '<div class="timeline-rail-line"></div>' : ''}</div>
            <div class="timeline-body">
              <div class="timeline-time">${esc(it.time)}</div>
              <div class="timeline-activity">${esc(it.activity)}</div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  if (trip.equipment || trip.notes){
    mainHtml += `
      <div class="notice-rule"></div>
      <div class="notice-section">
        <h3 class="notice-heading"><span class="nh-icon">${ICON_BACKPACK}</span> לקראת ${isEvent ? 'האירוע' : 'היציאה'}</h3>
        ${trip.equipment ? `<div class="prep-row"><span class="prep-label">ציוד נדרש</span><p>${esc(trip.equipment)}</p></div>` : ''}
        ${trip.notes ? `<div class="prep-row prep-notes"><span class="prep-label">שימו לב</span><p>${esc(trip.notes)}</p></div>` : ''}
      </div>`;
  }

  if (trip.custom_regards || trip.head_name || trip.coordinator_name){
    mainHtml += `
      <div class="notice-rule"></div>
      <div class="notice-section signature-block">
        ${SEAL_RING_SVG}
        <div class="regards">${esc(trip.custom_regards || 'בברכה,')}</div>
        <div class="signatures-row">
          <div class="signature-col">${trip.head_name ? `<b>${esc(trip.head_name)}</b><div class="sig-title">ראש הישיבה</div>` : ''}</div>
          <div class="signature-col">${trip.coordinator_name ? `<b>${esc(trip.coordinator_name)}</b><div class="sig-title">רכז חברתי</div>` : ''}</div>
        </div>
      </div>`;
  }

  mainHtml += `</div><div class="section-divider"></div>`;

  // אירוע חברתי בלי רישום תלמידים: הודעה בלבד — אין roster_snapshot/approvals בכלל,
  // ואין טופס למלא. מציגים רק את פרטי האירוע שלמעלה, בלי חלק האישור.
  if (trip.requires_registration === false){
    content.innerHTML = mainHtml + `<p class="center-msg">זוהי הודעה בלבד ואינה דורשת רישום או אישור מצדכם.</p>`;
    return;
  }

  if (roster.length === 0 || classOptions.length === 0){
    content.innerHTML = mainHtml + `<p class="center-msg">לא ניתן לטעון אישור עצמאי ${isEvent ? 'לאירוע' : 'לטיול'} זה. יש לפנות למחנך/ת לקבלת קישור אישי.</p>`;
    return;
  }

  content.innerHTML = mainHtml + `
    <div class="trip-card" id="approvalCard">
      <div class="approval-heading-wrap">
        ${SEAL_RING_SVG}
        <h2 class="trip-title" style="font-size:1.2rem; margin-bottom:4px;">${isEvent ? 'אישור השתתפות באירוע' : 'אישור השתתפות בטיול'}</h2>
        <div style="color:var(--ink-soft); font-size:.85rem; font-weight:600;">${isEvent ? 'רישום הגעה' : 'אישור יציאה'}</div>
      </div>
      <div class="startBtnWrap" id="startWrap">
        <button class="btn btn-primary" id="startBtn">✍️ ${isEvent ? 'רישום הגעה לאירוע' : 'מילוי אישור יציאה'}</button>
      </div>
      <div id="formArea" style="display:none;">
        <div class="field">
          <label>כיתת הבן</label>
          <select id="classSelect">
            <option value="">— בחר/י —</option>
            ${classOptions.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>שם התלמיד</label>
          <input id="studentNameInput" placeholder="שם פרטי ומשפחה">
        </div>
        <div class="field">
          <label>שם ההורה המאשר</label>
          <input id="approverName" placeholder="שם מלא">
        </div>
        <div class="field">
          <label>טלפון ההורה המאשר</label>
          <input id="approverPhone" type="tel" inputmode="tel" placeholder="05X-XXXXXXX">
        </div>
        <div class="field">
          <label>ת.ז ההורה המאשר</label>
          <input id="approverId" placeholder="מספר תעודת זהות" inputmode="numeric" maxlength="9">
        </div>
        <div class="field">
          <label class="consent-check">
            <input type="checkbox" id="consentCheck">
            <span>${isEvent ? 'אני מאשר/ת את הגעת בני לאירוע' : 'אני מאשר לבני לצאת ולהשתתף בטיול'}</span>
          </label>
        </div>
        ${isEvent ? `
        <div class="field">
          <label>כמה הורים מגיעים</label>
          <div class="number-stepper">
            <button type="button" class="ns-btn ns-minus" aria-label="הפחתה">－</button>
            <input type="number" id="participantsParents" min="0" step="1" value="1" inputmode="numeric">
            <button type="button" class="ns-btn ns-plus" aria-label="הוספה">＋</button>
          </div>
        </div>` : ''}
        <div class="field">
          <label>חתימה</label>
          <div class="sig-pad-wrap"><canvas id="sigCanvas"></canvas></div>
          <button type="button" class="sig-clear" id="sigClear">ניקוי החתימה</button>
        </div>
        <div id="matchMsg"></div>
        <button class="btn btn-primary" style="width:100%;" id="submitApproval">✓ שליחת אישור</button>
      </div>
      <div id="resultArea"></div>
    </div>`;

  let pad = null;
  document.getElementById('startBtn').addEventListener('click', ()=>{
    document.getElementById('startWrap').style.display = 'none';
    document.getElementById('formArea').style.display = '';
    // חשוב: לאתחל את לוח החתימה רק אחרי שהקנבס נראה בפועל — קנבס בתוך אלמנט מוסתר
    // (display:none) מקבל רוחב 0 ונשאר שבור גם אחרי שמציגים אותו.
    pad = setupSignaturePad(document.getElementById('sigCanvas'));
    document.getElementById('sigClear').addEventListener('click', ()=> pad.clear());
  });

  document.getElementById('submitApproval').addEventListener('click', async ()=>{
    const matchMsg = document.getElementById('matchMsg');
    matchMsg.innerHTML = '';
    const classId = document.getElementById('classSelect').value;
    const studentName = cleanText(document.getElementById('studentNameInput').value);
    const approverName = cleanText(document.getElementById('approverName').value);
    const approverPhone = document.getElementById('approverPhone').value;
    const approverId = cleanText(document.getElementById('approverId').value).replace(/\D/g,'');

    if (!classId){ toast('יש לבחור כיתה'); return; }
    if (!studentName){ toast('יש להזין את שם התלמיד'); return; }
    if (!approverName){ toast('יש להזין את שמך'); return; }
    if (!approverPhone){ toast('יש להזין מספר טלפון'); return; }
    if (!approverId){ toast('יש להזין מספר תעודת זהות'); return; }
    if (!document.getElementById('consentCheck').checked){ toast('יש לאשר את השתתפות הבן בטיול'); return; }
    if (pad.isEmpty()){ toast('יש לחתום לפני השליחה'); return; }

    // זיהוי התלמיד: מספיק כיתה + שם תלמיד (שם פרטי). זה מה שקובע אם ההורה יכול לאשר —
    // לא חוסמים אף אחד בגלל אי-התאמה בשם/טלפון של ההורה עצמו.
    //
    // הצלבת שם ההורה + טלפון מול גיבוב חד-כיווני (verify_hashes שנשמר מראש על roster_snapshot)
    // עדיין רצה, אבל ברקע בלבד: היא לא חוסמת שליחה, ורק קובעת האם האישור מסומן כ"מזוהה"
    // (identity_verified) ולאיזה הורה (mother/father) לשייך את הת.ז שהוזנה. אם היא לא
    // תואמת (למשל טלפון שהשתנה, כינוי במקום שם מלא וכו') — האישור עדיין עובר, רק בלי הזיהוי
    // האוטומטי; אפשר תמיד לבדוק ידנית מול הצוות אם יש אישורים לא-מזוהים שדורשים תשומת לב.
    const candidateHash = await sha256Hex(`${firstNameOf(approverName)}|${normPhoneDigits(approverPhone)}`);
    const typedNorm = norm(studentName);
    const nameMatches = roster.filter(r => r.class_id === classId && typedStartsWithFirstName(typedNorm, candFirstName(r)));

    if (nameMatches.length === 0){
      matchMsg.innerHTML = `<p style="color:var(--danger); font-size:.88rem;">לא נמצא תלמיד בשם זה בכיתה שנבחרה. יש לוודא שהכיתה ושם התלמיד נכונים, או לפנות למחנך/ת.</p>`;
      return;
    }

    let matchedStudent = null;
    let matchedSlot = null;
    let identityVerified = false;

    if (nameMatches.length === 1){
      matchedStudent = nameMatches[0];
      const match = (matchedStudent.verify_hashes||[]).find(h => h.hash === candidateHash);
      if (match){ identityVerified = true; matchedSlot = match.slot; }
    } else {
      // יותר מתלמיד אחד עם אותו שם פרטי באותה כיתה — קודם מנסים לצמצם לפי שם המשפחה
      // שההורה הקליד. משווים מול שם המשפחה האמיתי שנשמר בכרטיס (candLastName), אחרי
      // שמורידים מהטקסט שהוקלד רק את השם הפרטי שכבר התאים למועמד/ת הספציפי/ת — כך זה
      // עובד נכון גם כששם פרטי הוא מכמה מילים (למשל "בת אל"). רק אם זה לא הצליח לצמצם
      // לתלמיד יחיד, נופלים חזרה על ההצלבה מול פרטי ההורה (verify_hashes) כפי שהיה קודם.
      const candidates = nameMatches.filter(r => {
        const remainder = remainderAfterFirstName(typedNorm, candFirstName(r));
        return !remainder || remainder === candLastName(r);
      });

      if (candidates.length === 1){
        matchedStudent = candidates[0];
        const match = (matchedStudent.verify_hashes||[]).find(h => h.hash === candidateHash);
        if (match){ identityVerified = true; matchedSlot = match.slot; }
      } else {
        const verifiedMatches = nameMatches.filter(r => (r.verify_hashes||[]).some(h => h.hash === candidateHash));
        if (verifiedMatches.length === 1){
          matchedStudent = verifiedMatches[0];
          identityVerified = true;
          matchedSlot = matchedStudent.verify_hashes.find(h => h.hash === candidateHash).slot;
        } else {
          matchMsg.innerHTML = `<p style="color:var(--danger); font-size:.88rem;">יש בכיתה זו יותר מתלמיד אחד בשם "${esc(firstNameOf(studentName))}". נא להזין גם שם משפחה מלא ומדויק (כפי שנמסר למחנך/ת) כדי לזהות את הילד/ה הנכון/ה, או לפנות למחנך/ת.</p>`;
          return;
        }
      }
    }

    const studentId = matchedStudent.id;
    const approvalRef = tripRef.collection('approvals').doc(studentId);
    const approvalSnap = await approvalRef.get();
    if (!approvalSnap.exists){
      matchMsg.innerHTML = `<p style="color:var(--danger); font-size:.88rem;">לא נמצא רישום אישור עבור תלמיד זה. יש לפנות למחנך/ת.</p>`;
      return;
    }
    if (approvalSnap.data().status === 'approved'){
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('resultArea').innerHTML = `<div class="approved-card"><div class="big-check">✅</div><p style="color:var(--ink-soft); margin:0;">כבר אושר קודם, תודה!</p></div>`;
      return;
    }

    const btn = document.getElementById('submitApproval');
    btn.disabled = true; btn.textContent = 'שולח…';
    try{
      const extraPayload = {};
      if (isEvent){
        // התלמיד/ה שעבורו/ה מאשרים נספר/ת אוטומטית כאחד — לא מבקשים מההורה למלא את זה,
        // רק את מספר ההורים המגיעים.
        const nParents = parseInt(document.getElementById('participantsParents').value, 10);
        extraPayload.participants_students = 1;
        extraPayload.participants_parents = Number.isFinite(nParents) && nParents >= 0 ? nParents : 0;
      }
      await approvalRef.update({
        status: 'approved',
        approved_by_name: approverName,
        approved_by_id: approverId,
        consent: true,
        signature: pad.dataUrl(),
        approved_at: firebase.firestore.FieldValue.serverTimestamp(),
        identity_verified: identityVerified,
        ...extraPayload,
      });
      // שמירת הת.ז לכרטיס התלמיד/ה — רק לשדה ההורה שזוהה בהצלבה, ורק אם עדיין ריק
      // (הכלל ב-Firestore חוסם דריסה של ת.ז קיימת, ומאפשר רק מילוי ראשוני).
      if (matchedSlot){
        const field = matchedSlot === 'mother' ? 'mother_id' : 'father_id';
        db.collection('students').doc(studentId).update({ [field]: approverId }).catch(()=>{ /* כבר קיימת ת.ז, או שאין הרשאה — לא קריטי */ });
      }
      const matchedClassName = classOptions.find(c=>c.id===matchedStudent.class_id)?.name || '';
      notifyPush(
        'trip_approved',
        isEvent ? 'אישור הגעה חדש' : 'אישור טיול חדש',
        `${matchedStudent.full_name}${matchedClassName ? ' (' + matchedClassName + ')' : ''} אושר/ה ${isEvent ? 'להגעה ל' : 'לטיול'} "${trip.title}"`,
        matchedStudent.class_id
      );
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('resultArea').innerHTML = `<div class="approved-card"><div class="big-check">✅</div><p style="margin:0;">האישור נקלט, תודה!</p></div>`;
    }catch(err){
      toast('אירעה שגיאה, נסו שוב');
      btn.disabled = false; btn.textContent = '✓ שליחת אישור';
    }
  });
}
/* לחצני +/- ליד שדות כמות המשתתפים — ב-input type=number לבד אין דרך נוחה לגעת
   בחיצי ברירת המחדל בנייד, אז מוסיפים שני כפתורים גדולים במקום. */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.ns-btn');
  if (!btn) return;
  const input = btn.closest('.number-stepper')?.querySelector('input[type="number"]');
  if (!input) return;
  const min = input.min !== '' ? parseFloat(input.min) : -Infinity;
  const step = parseFloat(input.step) || 1;
  let val = parseFloat(input.value);
  if (!Number.isFinite(val)) val = Number.isFinite(min) ? min : 0;
  val = btn.classList.contains('ns-plus') ? val + step : val - step;
  if (Number.isFinite(min) && val < min) val = min;
  input.value = val;
});
load();
</script>
</body>
</html>
