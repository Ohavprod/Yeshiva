<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אישור טיול — ישיבה תיכונית עפולה</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16223d">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  body{ background:var(--paper); }
  .approve-wrap{ max-width:560px; margin:0 auto; padding:32px 20px 60px; }
  .approve-header{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .approve-header img{ height:48px; width:48px; border-radius:50%; }
  .trip-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow-sm); margin-bottom:22px; }
  .trip-meta{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0; font-size:.92rem; }
  .trip-meta div span{ display:block; color:var(--ink-soft); font-size:.78rem; }
  .center-msg{ text-align:center; color:var(--ink-soft); padding:60px 20px; }
  .approved-card{ text-align:center; padding:40px 24px; }
  .approved-card .big-check{ font-size:3rem; margin-bottom:10px; }
</style>
</head>
<body>
<div class="approve-wrap">
  <div class="approve-header">
    <img src="assets/img/logo.gif" alt="">
    <div>
      <div style="font-family:'Rubik',sans-serif; font-weight:700; color:var(--navy);">ישיבה תיכונית עפולה</div>
      <div style="font-size:.8rem; color:var(--ink-soft);">אישור השתתפות בטיול</div>
    </div>
  </div>
  <div id="content"><p class="center-msg">טוען פרטי טיול…</p></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebaseClient.js"></script>
<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const params = new URLSearchParams(location.search);
const tripId = params.get('t');
const studentId = params.get('s');

/* --- לוח חתימה פשוט (עכבר + מגע) --- */
function setupSignaturePad(canvas){
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = 160 * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#16203a';
  }
  resize();
  let drawing = false;
  let last = null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
  function move(e){
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); },
    isEmpty(){
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    },
    dataUrl(){ return canvas.toDataURL('image/png'); },
  };
}

async function load(){
  const content = document.getElementById('content');
  if (!tripId || !studentId){
    content.innerHTML = '<p class="center-msg">קישור לא תקין. יש לוודא שהקישור המלא שהתקבל הועתק במלואו.</p>';
    return;
  }
  const tripRef = db.collection('trips').doc(tripId);
  const approvalRef = tripRef.collection('approvals').doc(studentId);

  const [tripSnap, approvalSnap] = await Promise.all([tripRef.get(), approvalRef.get()]);
  if (!tripSnap.exists){
    content.innerHTML = '<p class="center-msg">הטיול המשויך לקישור זה לא נמצא.</p>';
    return;
  }
  if (!approvalSnap.exists){
    content.innerHTML = '<p class="center-msg">לא נמצא אישור התואם לקישור זה. יש לפנות למחנך/ת הכיתה.</p>';
    return;
  }
  const trip = tripSnap.data();
  const approval = approvalSnap.data();
  const studentName = approval.student_name || '';

  if (approval.status === 'approved'){
    const approvedDate = approval.approved_at?.toDate ? approval.approved_at.toDate() : null;
    content.innerHTML = `
      <div class="trip-card approved-card">
        <div class="big-check">✅</div>
        <h2 style="margin:0 0 6px;">האישור נקלט, תודה!</h2>
        <p style="color:var(--ink-soft); margin:0;">
          ${esc(studentName)} אושר/ה לטיול "${esc(trip.title)}"<br>
          ע״י ${esc(approval.approved_by_name||'')} ${approvedDate ? '· ' + approvedDate.toLocaleDateString('he-IL') : ''}
        </p>
      </div>`;
    return;
  }

  content.innerHTML = `
    <div class="trip-card">
      <h2 style="margin-top:0;">${esc(trip.title)}</h2>
      <div class="trip-meta">
        ${trip.trip_date ? `<div><span>תאריך</span>${new Date(trip.trip_date).toLocaleDateString('he-IL')}</div>` : ''}
        ${trip.location ? `<div><span>יעד</span>${esc(trip.location)}</div>` : ''}
        ${trip.departure_time ? `<div><span>שעת יציאה</span>${esc(trip.departure_time)}</div>` : ''}
        ${trip.return_time ? `<div><span>שעת חזרה</span>${esc(trip.return_time)}</div>` : ''}
        ${trip.cost ? `<div><span>עלות</span>${esc(trip.cost)}</div>` : ''}
      </div>
      ${trip.notes ? `<p style="color:var(--ink-soft); font-size:.9rem; border-top:1px solid var(--line); padding-top:14px;">${esc(trip.notes)}</p>` : ''}
    </div>
    <div class="trip-card">
      <h3 style="margin-top:0;">אישור השתתפות עבור ${esc(studentName)}</h3>
      <div class="field">
        <label>שם ההורה/ת המאשר/ת</label>
        <input placeholder="שם מלא" id="approverName">
      </div>
      <div class="field">
        <label>חתימה</label>
        <div class="sig-pad-wrap"><canvas id="sigCanvas"></canvas></div>
        <button type="button" class="sig-clear" id="sigClear">ניקוי החתימה</button>
      </div>
      <button class="btn btn-primary" style="width:100%;" id="submitApproval">✓ שליחת אישור</button>
    </div>
  `;

  const pad = setupSignaturePad(document.getElementById('sigCanvas'));
  document.getElementById('sigClear').addEventListener('click', ()=> pad.clear());

  document.getElementById('submitApproval').addEventListener('click', async ()=>{
    const name = document.getElementById('approverName').value.trim();
    if (!name){ toast('יש להזין שם'); return; }
    if (pad.isEmpty()){ toast('יש לחתום לפני השליחה'); return; }
    const btn = document.getElementById('submitApproval');
    btn.disabled = true; btn.textContent = 'שולח…';
    try{
      await approvalRef.update({
        status: 'approved',
        approved_by_name: name,
        signature: pad.dataUrl(),
        approved_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      load();
    }catch(err){
      toast('אירעה שגיאה, נסו שוב');
      btn.disabled = false; btn.textContent = '✓ שליחת אישור';
    }
  });
}
load();
</script>
</body>
</html>
