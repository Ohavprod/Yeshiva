function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>';

const ICON_BANKNOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9v0M18 15v0"/></svg>';
const ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>';
const ICON_BACKPACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8V6a4 4 0 0 1 8 0v2"/><rect x="5" y="8" width="14" height="13" rx="3"/><path d="M9 8v4h6V8M9 15h6"/></svg>';
const ICON_CALENDAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>';
/* --- שליחת התראת פוש (best-effort — לא חוסמת ולא נכשלת אם השרת לא מוגדר עדיין) ---
   ה-Content-Type נשאר ברירת המחדל (text/plain) בכוונה כדי למנוע preflight/CORS מול Apps Script. */
const PUSH_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyyFdMIyybL6S5tW0mXij3BB_6_M42g1gZtBub6ob2V40x4jYuFtnlk7su_EqbWklgQfw/exec';
const PUSH_WEBHOOK_SECRET = '88888888888888888888888888888888';
function notifyPush(type, title, body, classId){
  if (!PUSH_WEBHOOK_URL || PUSH_WEBHOOK_URL.indexOf('PASTE_') === 0) return;
  fetch(PUSH_WEBHOOK_URL, { method:'POST', body: JSON.stringify({ secret: PUSH_WEBHOOK_SECRET, type, title, body, class_id: classId || null }) }).catch(()=>{});
}
function fmtCost(v){ if (!v) return ''; const s = v.toString().trim(); return s.includes('₪') ? s : `${s} ₪`; }
function cleanText(s){ return (s||'').toString().trim().replace(/\s+/g,' '); }
/* תאריך לועזי מקוצר (יום.חודש.שנה דו-ספרתית), לשילוב בסוגריים ליד תאריך עברי —
   בהתאם לפורמט הטיולים: כ"ז אלול תשפ"ז (14.9.26). */
function formatGregShort(dateStr){
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear().toString().slice(-2)}`;
}

const params = new URLSearchParams(location.search);
const tripId = params.get('t');
const studentId = params.get('s');

/* --- לוח חתימה פשוט (עכבר + מגע) --- */
function setupSignaturePad(canvas){
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = 160 * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#16203a';
  }
  resize();
  let drawing = false, last = null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
  function move(e){
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); },
    isEmpty(){
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    },
    dataUrl(){ return canvas.toDataURL('image/png'); },
  };
}

function norm(s){ return (s||'').toString().trim().replace(/\s+/g,' ').toLowerCase(); }
function firstNameOf(s){ return norm(s).split(' ')[0] || ''; }
function normPhoneDigits(s){
  let d = (s||'').toString().replace(/\D/g,'');
  // תמיכה בהזנת מספר עם קידומת בינלאומית (972.../‎+972...) במקום 0 מקומי — כדי
  // ששני הפורמטים ("0501234567" ו-"972501234567") ינורמלו לאותה מחרוזת בדיוק,
  // ולא ייתפסו כאי-התאמה שגויה בין הורה שמקליד פורמט שונה מזה שנשמר במערכת.
  if (d.startsWith('972') && d.length === 12){ d = '0' + d.slice(3); }
  return d;
}
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function load(){
  const content = document.getElementById('content');
  if (!tripId || !studentId){
    content.innerHTML = '<p class="center-msg">קישור לא תקין. יש לוודא שהקישור המלא שהתקבל הועתק במלואו.</p>';
    return;
  }
  const tripRef = db.collection('trips').doc(tripId);
  const approvalRef = tripRef.collection('approvals').doc(studentId);

  const [tripSnap, approvalSnap] = await Promise.all([tripRef.get(), approvalRef.get()]);
  if (!tripSnap.exists){
    content.innerHTML = '<p class="center-msg">הטיול המשויך לקישור זה לא נמצא.</p>';
    return;
  }
  if (!approvalSnap.exists){
    content.innerHTML = '<p class="center-msg">לא נמצא אישור התואם לקישור זה. יש לפנות למחנך/ת הכיתה.</p>';
    return;
  }
  const trip = tripSnap.data();
  const approval = approvalSnap.data();
  const studentName = approval.student_name || '';
  const className = approval.class_name || '';
  // class_id של התלמיד/ה — נשלף מ-roster_snapshot של הטיול (לא נשמר על מסמך האישור
  // עצמו), כדי שאפשר יהיה להעביר אותו ל-notifyPush ולסנן את ההתראה למחנך/ת הכיתה
  // הנכונה בלבד, גם בטיול/אירוע כלל-ישיבתי המשותף לכמה כיתות.
  const studentClassId = (trip.roster_snapshot||[]).find(r=>r.id===studentId)?.class_id || null;
  const itinerary = trip.itinerary || [];
  const gregDate = formatGregShort(trip.trip_date);
  const isEvent = trip.kind === 'event';
  const detailsWord = isEvent ? 'האירוע' : 'הטיול';

  if (approval.status === 'approved'){
    const approvedDate = approval.approved_at?.toDate ? approval.approved_at.toDate() : null;
    content.innerHTML = `
      <div class="trip-card approved-card">
        <div class="big-check">✅</div>
        <h2 style="margin:0 0 6px;">האישור נקלט, תודה!</h2>
        <p style="color:var(--ink-soft); margin:0;">
          ${esc(studentName)} אושר/ה לטיול "${esc(trip.title)}"<br>
          ע״י ${esc(approval.approved_by_name||'')}${approval.approved_by_relation ? ' (' + esc(approval.approved_by_relation) + ')' : ''} ${approvedDate ? '· ' + approvedDate.toLocaleDateString('he-IL') : ''}
        </p>
      </div>`;
    return;
  }

  renderTripAndApprovalForm();

  /* בניגוד לגרסה הקודמת: אין יותר שער אימות נפרד לפני הצגת חוזר הטיול. ההורה רואה
     קודם את כל פרטי הטיול, לוחץ "מילוי אישור יציאה", וממלא טופס אחד יחיד (שם, טלפון,
     ת.ז, הסכמה, חתימה) — ההצלבה מול verify_hashes מתבצעת "מאחורי הקלעים" רק בלחיצה
     על שליחה: אם לא תואם, מוצגת שגיאה במקום; אם תואם, האישור נשמר מיד. */
  function renderTripAndApprovalForm(){
  let mainHtml = `
    ${studentName ? `<div class="match-confirm">אישור ${isEvent ? 'הגעה' : 'טיול'} עבור: ${esc(studentName)}${className ? ' · כיתה ' + esc(className) : ''}</div>` : ''}
    <div class="notice-sheet">
      <div class="notice-section">
        <h2 class="trip-title" style="margin-bottom:${trip.subtitle ? '2px' : ''};">${esc(trip.title)}</h2>
        ${trip.subtitle ? `<div style="color:var(--ink-soft); font-size:1.15rem; font-weight:600; margin-bottom:14px;">${esc(trip.subtitle)}</div>` : ''}
        ${trip.intro_text ? `<div class="intro-callout">${esc(trip.intro_text)}</div>` : ''}
        ${(trip.hebrew_date || gregDate) ? `<div class="date-line"><div class="date-chip">
          <div class="dc-icon">${ICON_CALENDAR}</div>
          <div>
            <span class="lbl">תאריך ${detailsWord}</span>
            ${trip.hebrew_date ? `<span class="heb">${esc(trip.hebrew_date)}</span>` : ''}
            ${trip.hebrew_date && gregDate ? `<span class="greg">(${gregDate})</span>` : (gregDate ? `<span class="heb">${gregDate}</span>` : '')}
          </div>
        </div></div>` : ''}
        <div class="meta-badges">
          ${trip.location ? `<div class="meta-badge"><div class="m-icon">${ICON_PIN}</div><div class="m-label">${isEvent ? 'מיקום האירוע' : 'יעד'}</div><div class="m-value">${esc(trip.location)}</div></div>` : ''}
          ${trip.departure_time ? `<div class="meta-badge"><div class="m-icon">${ICON_CLOCK}</div><div class="m-label">${isEvent ? 'תחילת האירוע' : 'שעת יציאה מהישיבה'}</div><div class="m-value">${esc(trip.departure_time)}</div></div>` : ''}
          ${trip.return_time ? `<div class="meta-badge"><div class="m-icon">${ICON_CLOCK}</div><div class="m-label">${isEvent ? 'סיום האירוע' : 'שעת חזרה לישיבה'}</div><div class="m-value">${esc(trip.return_time)}</div></div>` : ''}
          ${trip.cost ? `<div class="meta-badge"><div class="m-icon">${ICON_BANKNOTE}</div><div class="m-label">עלות</div><div class="m-value">${esc(fmtCost(trip.cost))}</div></div>` : ''}
        </div>
      </div>`;

  if (itinerary.length){
    mainHtml += `
      <div class="notice-rule"></div>
      <div class="notice-section">
        <h3 class="notice-heading"><span class="nh-icon">${ICON_LIST}</span> מה בתוכנית</h3>
        ${itinerary.map((it,i)=>`
          <div class="timeline-item">
            <div class="timeline-rail"><div class="timeline-dot"></div>${i < itinerary.length-1 ? '<div class="timeline-rail-line"></div>' : ''}</div>
            <div class="timeline-body">
              <div class="timeline-time">${esc(it.time)}</div>
              <div class="timeline-activity">${esc(it.activity)}</div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  if (trip.equipment || trip.notes){
    mainHtml += `
      <div class="notice-rule"></div>
      <div class="notice-section">
        <h3 class="notice-heading"><span class="nh-icon">${ICON_BACKPACK}</span> לקראת ${isEvent ? 'האירוע' : 'היציאה'}</h3>
        ${trip.equipment ? `<div class="prep-row"><span class="prep-label">ציוד נדרש</span><p>${esc(trip.equipment)}</p></div>` : ''}
        ${trip.notes ? `<div class="prep-row prep-notes"><span class="prep-label">שימו לב</span><p>${esc(trip.notes)}</p></div>` : ''}
      </div>`;
  }

  if (trip.custom_regards || trip.head_name || trip.coordinator_name){
    mainHtml += `
      <div class="notice-rule"></div>
      <div class="notice-section signature-block">
        <div class="regards">${esc(trip.custom_regards || 'בברכה,')}</div>
        <div class="signatures-row">
          <div class="signature-col">${trip.head_name ? `<b>${esc(trip.head_name)}</b><div class="sig-title">ראש הישיבה</div>` : ''}</div>
          <div class="signature-col">${trip.coordinator_name ? `<b>${esc(trip.coordinator_name)}</b><div class="sig-title">רכז חברתי</div>` : ''}</div>
        </div>
      </div>`;
  }

  mainHtml += `</div><div class="section-divider"></div>`;

  const nameParts = (()=>{
    const parts = (studentName||'').trim().split(/\s+/);
    return { first: parts[0] || '', last: parts.slice(1).join(' ') || '' };
  })();

  content.innerHTML = mainHtml + `
    <div class="trip-card" id="approvalCard">
      <div class="approval-heading-wrap">
        <h3 class="trip-title" style="font-size:1.2rem; margin-bottom:4px;">${isEvent ? 'אישור השתתפות באירוע' : 'אישור השתתפות בטיול'}</h3>
        <div style="color:var(--ink-soft); font-size:.85rem; font-weight:600;">${isEvent ? 'רישום הגעה' : 'אישור יציאה'}</div>
      </div>
      <div class="student-summary" style="display:flex; gap:22px; flex-wrap:wrap; margin-bottom:20px; padding:14px 16px; background:var(--paper-2); border-radius:12px;">
        <div><div style="font-size:.72rem; color:var(--ink-soft);">שם פרטי</div><div style="font-weight:700;">${esc(nameParts.first)}</div></div>
        <div><div style="font-size:.72rem; color:var(--ink-soft);">שם משפחה</div><div style="font-weight:700;">${esc(nameParts.last)}</div></div>
        ${className ? `<div><div style="font-size:.72rem; color:var(--ink-soft);">כיתה</div><div style="font-weight:700;">${esc(className)}</div></div>` : ''}
      </div>
      <div class="startBtnWrap" id="startWrap">
        <button class="btn btn-primary" id="startBtn">✍️ ${isEvent ? 'רישום הגעה לאירוע' : 'מילוי אישור יציאה'}</button>
      </div>
      <div id="formArea" style="display:none;">
        <div id="verifyErrorBox"></div>
        <div class="field">
          <label>שם ההורה המאשר</label>
          <input placeholder="שם מלא" id="approverName">
        </div>
        <div class="field">
          <label>טלפון ההורה המאשר</label>
          <input placeholder="05X-XXXXXXX" id="approverPhone" type="tel" inputmode="tel">
        </div>
        <div class="field">
          <label>ת.ז ההורה המאשר</label>
          <input placeholder="מספר תעודת זהות" id="approverId" inputmode="numeric" maxlength="9">
        </div>
        <div class="field">
          <label class="consent-check">
            <input type="checkbox" id="consentCheck">
            <span>${isEvent ? 'אני מאשר/ת את הגעת בני לאירוע' : 'אני מאשר/ת לבני לצאת ולהשתתף בטיול'}</span>
          </label>
        </div>
        ${isEvent ? `
        <div class="field">
          <label>כמה הורים מגיעים</label>
          <div class="number-stepper">
            <button type="button" class="ns-btn ns-minus" aria-label="הפחתה">－</button>
            <input type="number" id="participantsParents" min="0" step="1" value="1" inputmode="numeric">
            <button type="button" class="ns-btn ns-plus" aria-label="הוספה">＋</button>
          </div>
        </div>` : ''}
        <div class="field">
          <label>חתימה</label>
          <div class="sig-pad-wrap"><canvas id="sigCanvas"></canvas></div>
          <button type="button" class="sig-clear" id="sigClear">ניקוי החתימה</button>
        </div>
        <button class="btn btn-primary" style="width:100%;" id="submitApproval">✓ שליחת אישור</button>
      </div>
    </div>
  `;

  let pad = null;
  document.getElementById('startBtn').addEventListener('click', ()=>{
    document.getElementById('startWrap').style.display = 'none';
    document.getElementById('formArea').style.display = '';
    // חשוב: לאתחל את לוח החתימה רק אחרי שהקנבס נראה בפועל — קנבס בתוך אלמנט מוסתר
    // (display:none) מקבל רוחב 0 ונשאר שבור גם אחרי שמציגים אותו.
    pad = setupSignaturePad(document.getElementById('sigCanvas'));
    document.getElementById('sigClear').addEventListener('click', ()=> pad.clear());
  });

  document.getElementById('submitApproval').addEventListener('click', async ()=>{
    const verifyErrorBox = document.getElementById('verifyErrorBox');
    verifyErrorBox.innerHTML = '';
    const name = cleanText(document.getElementById('approverName').value);
    const phone = document.getElementById('approverPhone').value;
    const idDigits = document.getElementById('approverId').value.replace(/\D/g,'');
    if (!name){ toast('יש להזין שם'); return; }
    if (!phone){ toast('יש להזין מספר טלפון'); return; }
    if (idDigits.length !== 9){ toast('יש להזין מספר תעודת זהות בן 9 ספרות'); return; }
    if (!document.getElementById('consentCheck').checked){ toast('יש לאשר את השתתפות הבן בטיול'); return; }
    if (pad.isEmpty()){ toast('יש לחתום לפני השליחה'); return; }

    // ההצלבה "מאחורי הקלעים": שם פרטי של ההורה + טלפון, כל אחד בנפרד מול name_hash/
    // phone_hash שנשמרו מראש על מסמך האישור (לכל הורה/סלוט בנפרד: אמא/אבא). בזכות
    // ההפרדה לשני גיבובים (ולא גיבוב אחד משולב) אפשר לומר בדיוק אם השם או הטלפון
    // (או שניהם) הם אלה שלא תואמים — ולא רק "אחד מהפרטים שגוי".
    // תמיכה לאחור: קישורי אישור ישנים שנוצרו לפני השינוי הזה עדיין שומרים רק hash
    // משולב אחד — עבורם ממשיכים לבדוק בשיטה הישנה (בלי אבחון מפורט).
    let matchedSlot = null;
    const hashes = approval.verify_hashes || [];
    const hasGranularHashes = hashes.some(h => h.name_hash || h.phone_hash);
    if (hasGranularHashes){
      const candidateName = await sha256Hex(`${firstNameOf(name)}|${norm(className)}`);
      const candidatePhone = await sha256Hex(`${normPhoneDigits(phone)}|${norm(className)}`);
      const fullMatch = hashes.find(h => h.name_hash === candidateName && h.phone_hash === candidatePhone);
      if (!fullMatch){
        const nameOkSlot = hashes.find(h => h.name_hash === candidateName);
        const phoneOkSlot = hashes.find(h => h.phone_hash === candidatePhone);
        const relLabel = (slot)=> slot === 'mother' ? 'האמא' : 'האבא';
        const refCode = 'ה' + studentId.slice(0,4).toUpperCase();
        let specific;
        if (nameOkSlot && !phoneOkSlot){
          specific = `השם הפרטי שהוזן תואם ל${relLabel(nameOkSlot.slot)} הרשום/ה, אבל <b>מספר הטלפון שהוזן שגוי</b> — הוא לא תואם למספר שנמסר למחנך/ת עבור ${relLabel(nameOkSlot.slot)}.`;
        } else if (!nameOkSlot && phoneOkSlot){
          specific = `מספר הטלפון שהוזן תואם למספר של ${relLabel(phoneOkSlot.slot)} הרשום/ה, אבל <b>השם הפרטי שהוזן שגוי</b> — יש להזין את השם הפרטי בלבד (בלי שם משפחה) כפי שנמסר למחנך/ת.`;
        } else {
          specific = `גם <b>השם הפרטי</b> וגם <b>מספר הטלפון</b> שהוזנו אינם תואמים לאף הורה הרשום עבור ${esc(studentName)} במערכת.`;
        }
        verifyErrorBox.innerHTML = `<div class="verify-error" style="text-align:right;">
          <b>הפרטים שהוזנו אינם תואמים את מה שרשום במערכת עבור ${esc(studentName)}.</b><br>
          ${specific}<br><br>
          אם הפרטים נכונים ועדיין מופיעה שגיאה זו — יש לפנות למחנך/ת הכיתה או למנהל המערכת ולמסור את הקוד: <b dir="ltr">${refCode}</b>
        </div>`;
        return;
      }
      matchedSlot = fullMatch.slot;
    } else if (hashes.length){
      // קישורים ישנים (לפני השדרוג) — גיבוב משולב אחד, בלי אבחון מפורט.
      const candidate = await sha256Hex(`${firstNameOf(name)}|${normPhoneDigits(phone)}|${norm(className)}`);
      const match = hashes.find(h => h.hash === candidate);
      if (!match){
        const refCode = 'ה' + studentId.slice(0,4).toUpperCase();
        verifyErrorBox.innerHTML = `<div class="verify-error" style="text-align:right;">
          <b>הפרטים שהוזנו אינם תואמים את מה שרשום במערכת עבור ${esc(studentName)}.</b><br>
          כדאי לבדוק שוב:
          <ul style="margin:8px 0 8px 18px; padding:0;">
            <li>שם פרטי של ההורה בלבד (בלי שם משפחה) — כפי שנמסר למחנך/ת</li>
            <li>מספר הטלפון בדיוק כפי שנמסר למחנך/ת (למשל אם הוא מתחיל ב-0, לא ב-972+)</li>
          </ul>
          אם הפרטים נכונים ועדיין מופיעה שגיאה זו — יש לפנות למחנך/ת הכיתה או למנהל המערכת ולמסור את הקוד: <b dir="ltr">${refCode}</b>
        </div>`;
        return;
      }
      matchedSlot = match.slot;
    }

    const btn = document.getElementById('submitApproval');
    btn.disabled = true; btn.textContent = 'שולח…';
    try{
      const extraPayload = {};
      if (isEvent){
        // התלמיד/ה שעבורו/ה מאשרים נספר/ת אוטומטית כאחד — לא מבקשים מההורה למלא את זה,
        // רק את מספר ההורים המגיעים (כמו בטופס הכללי, trip-notice.html).
        const nParents = parseInt(document.getElementById('participantsParents').value, 10);
        extraPayload.participants_students = 1;
        extraPayload.participants_parents = Number.isFinite(nParents) && nParents >= 0 ? nParents : 0;
      }
      // set(..., {merge:true}) ולא update(): אם מסמך האישור נמחק בעבר (למשל תלמיד
      // שהוסר מהכיתה וחזר), update() היה נכשל כי אין מסמך לעדכן — וההודעה
      // "אירעה שגיאה" הייתה מוסתרת מכל התהליך, כולל שליחת ה-notifyPush למטה.
      await approvalRef.set({
        status: 'approved',
        approved_by_name: name,
        approved_by_id: idDigits,
        approved_by_relation: matchedSlot === 'mother' ? 'אמא' : (matchedSlot === 'father' ? 'אבא' : ''),
        consent: true,
        signature: pad.dataUrl(),
        approved_at: firebase.firestore.FieldValue.serverTimestamp(),
        ...extraPayload,
      }, { merge: true });
      // שמירת הת.ז שהוזנה לכרטיס התלמיד/ה — רק לשדה ההורה שזוהה באימות (אמא/אבא), ורק אם
      // עדיין ריק שם (הכלל ב-Firestore חוסם דריסה של ת.ז קיימת, ומאפשר רק מילוי ראשוני).
      if (matchedSlot){
        const field = matchedSlot === 'mother' ? 'mother_id' : 'father_id';
        db.collection('students').doc(studentId).update({ [field]: idDigits }).catch(()=>{ /* כבר קיימת ת.ז, או שאין הרשאה — לא קריטי */ });
      }
      notifyPush('trip_approved', 'אישור טיול חדש', `${studentName}${className ? ' (' + className + ')' : ''} אושר/ה לטיול "${trip.title}"`, studentClassId);
      load();
    }catch(err){
      // שגיאה כללית של המערכת (לא אי-התאמת פרטים) — למשל בעיית הרשאות/רשת מול
      // Firestore. מציגים את קוד השגיאה הטכני עצמו (err.code, כמו 'permission-denied'
      // או 'unavailable') כדי שההורה יוכל למסור אותו בדיוק למנהל המערכת, במקום הודעה
      // גנרית שאי אפשר לעשות איתה כלום כשמנסים לאבחן מה קרה.
      console.error('שגיאת שליחת אישור:', err);
      const errCode = err?.code || err?.message || 'לא ידוע';
      verifyErrorBox.innerHTML = `<div class="verify-error" style="text-align:right;">
        <b>אירעה שגיאה טכנית ולא ניתן היה לשלוח את האישור.</b><br>
        אפשר לנסות שוב בעוד רגע. אם השגיאה חוזרת, יש לפנות למנהל המערכת ולמסור את הקוד: <b dir="ltr">SYS-${esc(errCode)}</b>
      </div>`;
      toast('אירעה שגיאה, נסו שוב');
      btn.disabled = false; btn.textContent = '✓ שליחת אישור';
    }
  });
  } // end renderTripAndApprovalForm
}
/* לחצני +/- ליד שדות כמות המשתתפים — ב-input type=number לבד אין דרך נוחה לגעת
   בחיצי ברירת המחדל בנייד, אז מוסיפים שני כפתורים גדולים במקום. */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.ns-btn');
  if (!btn) return;
  const input = btn.closest('.number-stepper')?.querySelector('input[type="number"]');
  if (!input) return;
  const min = input.min !== '' ? parseFloat(input.min) : -Infinity;
  const step = parseFloat(input.step) || 1;
  let val = parseFloat(input.value);
  if (!Number.isFinite(val)) val = Number.isFinite(min) ? min : 0;
  val = btn.classList.contains('ns-plus') ? val + step : val - step;
  if (Number.isFinite(min) && val < min) val = min;
  input.value = val;
});
load();
</script>
</body>
</html>
